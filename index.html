<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>个人知识库</title>
    <style>
      :root {
        --primary: #2667E8;
        --primary-dark: #1B4FBB;
        --primary-soft: #EDF4FF;
        --ink: #18253A;
        --body: #35445B;
        --muted: #7C8BA1;
        --border: #E3E9F1;
        --page: #F5F7FB;
        --card: #FFFFFF;
        --danger: #C9372C;
        --danger-soft: #FDECEA;
        --ok: #1E7D46;
        --ok-soft: #E6F4EC;
        --warn: #9A6B12;
        --warn-soft: #FBF3DC;
        --radius: 8px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --primary: #5B8DEF;
          --primary-dark: #8FB0F5;
          --primary-soft: #1C2B47;
          --ink: #E8EEF7;
          --body: #C3CFDE;
          --muted: #8B9BB3;
          --border: #2C3A52;
          --page: #111A2C;
          --card: #182236;
          --danger: #F0938A;
          --danger-soft: #3A2321;
          --ok: #7CC79B;
          --ok-soft: #1E3329;
          --warn: #E3C078;
          --warn-soft: #38301C;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--page);
        color: var(--body);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.55;
      }
      button, input, select, textarea { font: inherit; color: inherit; }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }

      .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 40px; }

      /* ---------- Header ---------- */
      header.top {
        background: var(--card);
        border-bottom: 1px solid var(--border);
      }
      .top-inner { max-width: 1100px; margin: 0 auto; padding: 22px 16px 18px; }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
        color: var(--ink);
        font-weight: 700;
        letter-spacing: .01em;
      }
      .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
      .search-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
      .search-box { flex: 1 1 240px; position: relative; }
      .search-box svg {
        position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
        width: 16px; height: 16px; color: var(--muted); pointer-events: none;
      }
      #searchInput {
        width: 100%; height: 40px;
        padding: 8px 36px 8px 34px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--page);
        color: var(--ink);
        outline: none;
      }
      #searchInput:focus { border-color: var(--primary); background: var(--card); box-shadow: 0 0 0 3px var(--primary-soft); }
      #clearSearch {
        position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
        border: 0; background: transparent; color: var(--muted);
        width: 32px; height: 32px; min-height: 32px; border-radius: 6px; cursor: pointer;
        display: none; align-items: center; justify-content: center; font-size: 16px; line-height: 1;
      }
      #clearSearch:hover { color: var(--ink); }
      .btn {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--body);
        border-radius: var(--radius);
        padding: 7px 14px;
        cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px;
        white-space: nowrap;
      }
      .btn:hover { border-color: var(--primary); color: var(--primary); }
      .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
      .btn.primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); color: #fff; }
      .btn.small { padding: 4px 10px; min-height: 32px; font-size: 13px; }
      .btn.danger:hover { border-color: var(--danger); color: var(--danger); }

      /* ---------- Nav ---------- */
      nav.libs { margin: 18px 0 6px; }
      .lib-list { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
      .lib-btn {
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
        color: var(--body);
        display: inline-flex; align-items: center; gap: 7px;
        min-height: 36px;
      }
      .lib-btn .count {
        font-size: 12px; color: var(--muted);
        background: var(--page);
        border: 1px solid var(--border);
        border-radius: 999px; padding: 0 7px; line-height: 18px;
      }
      .lib-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
      .lib-btn.active .count { background: rgba(255,255,255,.18); border-color: transparent; color: #fff; }

      .toolbar {
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        margin: 12px 0 4px;
      }
      .toolbar .spacer { flex: 1; }
      .result-note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

      /* ---------- Entry cards ---------- */
      .group-title {
        margin: 22px 0 10px;
        font-size: 15px; font-weight: 700; color: var(--ink);
        display: flex; align-items: baseline; gap: 8px;
      }
      .group-title .g-count { font-size: 12px; font-weight: 400; color: var(--muted); }
      .cards { display: grid; grid-template-columns: 1fr; gap: 10px; }
      @media (min-width: 760px) { .cards { grid-template-columns: 1fr 1fr; } }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px 12px;
        display: flex; flex-direction: column; gap: 8px;
      }
      .card-head { display: flex; align-items: flex-start; gap: 8px; }
      .card-title { margin: 0; font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.4; flex: 1; }
      .badges { display: flex; flex-wrap: wrap; gap: 5px; flex-shrink: 0; }
      .badge {
        font-size: 11px; line-height: 18px; padding: 0 7px;
        border-radius: 4px; white-space: nowrap;
      }
      .badge.lib { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
      .badge.pub { background: var(--page); color: var(--muted); border: 1px solid var(--border); }
      .badge.mine { background: var(--primary); color: #fff; }
      .badge.ok { background: var(--ok-soft); color: var(--ok); }
      .badge.pending { background: var(--warn-soft); color: var(--warn); }
      .card-content { white-space: pre-wrap; word-break: break-word; color: var(--body); }
      .card-content.long { font-size: 13.5px; }
      .card-meta {
        margin-top: auto; padding-top: 8px;
        border-top: 1px dashed var(--border);
        color: var(--muted); font-size: 12.5px;
        display: flex; flex-wrap: wrap; gap: 4px 12px;
      }
      .tag-chip { color: var(--primary); }
      .card-actions { display: flex; gap: 6px; }
      mark { background: #FFE58A; color: inherit; border-radius: 2px; padding: 0 1px; }
      @media (prefers-color-scheme: dark) { mark { background: #6B5A1E; } }

      .empty {
        background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius);
        padding: 28px 16px; text-align: center; color: var(--muted); margin-top: 14px;
      }

      /* ---------- Modal form ---------- */
      .overlay {
        position: fixed; inset: 0; background: rgba(16, 24, 40, .48);
        display: none; align-items: flex-end; justify-content: center; z-index: 50;
      }
      .overlay.open { display: flex; }
      .sheet {
        background: var(--card); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto;
        border-radius: 12px 12px 0 0; padding: 20px 18px 24px;
      }
      @media (min-width: 700px) {
        .overlay { align-items: center; padding: 20px; }
        .sheet { border-radius: 12px; }
      }
      .sheet h2 { margin: 0 0 4px; font-size: 17px; color: var(--ink); }
      .sheet .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
      .field { margin-bottom: 12px; }
      .field label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
      .field input[type="text"], .field select, .field textarea {
        width: 100%; border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--page); color: var(--ink); padding: 8px 10px; outline: none;
      }
      .field textarea { min-height: 110px; resize: vertical; line-height: 1.55; }
      .field input:focus, .field select:focus, .field textarea:focus {
        border-color: var(--primary); background: var(--card); box-shadow: 0 0 0 3px var(--primary-soft);
      }
      .field .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
      .form-row { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
      @media (min-width: 560px) { .form-row { grid-template-columns: 1fr 1fr; } }
      .sheet-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

      .confirm-box { text-align: left; }
      .confirm-box p { margin: 6px 0 0; }

      .toast {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(16px);
        background: var(--ink); color: var(--page);
        padding: 9px 16px; border-radius: 8px; font-size: 13.5px;
        opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 80;
        max-width: calc(100vw - 32px); text-align: center;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      footer {
        margin-top: 34px; padding: 16px;
        background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
        color: var(--muted); font-size: 12.5px;
      }
      footer strong { color: var(--body); }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <h1>个人知识库</h1>
        <p class="subtitle">公开版 · 仅含可公开内容</p>
        <div class="search-row">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
            <input id="searchInput" type="text" placeholder="搜索标题、内容、标签…" autocomplete="off" aria-label="全文搜索" />
            <button id="clearSearch" type="button" aria-label="清除搜索">×</button>
          </div>
          <button class="btn primary" id="addBtn" type="button">＋ 新增条目</button>
        </div>
      </div>
    </header>

    <div class="wrap">
      <nav class="libs" aria-label="知识库分区">
        <ul class="lib-list" id="libList"></ul>
      </nav>

      <div class="toolbar">
        <span class="result-note" id="resultNote" role="status"></span>
        <span class="spacer"></span>
        <button class="btn small" id="exportBtn" type="button">导出 JSON 备份</button>
        <button class="btn small" id="importBtn" type="button">导入 JSON</button>
        <input class="sr-only" id="importFile" type="file" accept="application/json,.json" aria-label="选择要导入的 JSON 文件" />
      </div>

      <main id="listMain"></main>

      <footer>
        <strong>说明：</strong>本页为公开版，仅含可公开内容。私人内容（财务、健康、公司内部数据、求职细节）不在此页。你在本页添加或修改的内容只保存在当前设备浏览器中，不会同步到公开页面；换设备请用导出/导入。
      </footer>
    </div>

    <!-- 新增 / 编辑 -->
    <div class="overlay" id="formOverlay" role="dialog" aria-modal="true" aria-labelledby="formTitle">
      <div class="sheet">
        <h2 id="formTitle">新增条目</h2>
        <p class="hint">新条目只保存在当前设备的浏览器中，标记为「我的」，不会同步到公开页面。</p>
        <form id="entryForm">
          <div class="form-row">
            <div class="field">
              <label for="fLib">所属库</label>
              <select id="fLib"></select>
            </div>
            <div class="field">
              <label for="fStatus">状态</label>
              <select id="fStatus">
                <option value="已确认">已确认</option>
                <option value="待确认">待确认</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="fTitle">标题</label>
            <input id="fTitle" type="text" required maxlength="120" placeholder="例如：看板设计原则" />
          </div>
          <div class="field">
            <label for="fContent">内容</label>
            <textarea id="fContent" required maxlength="6000" placeholder="条目正文，可换行"></textarea>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="fTags">标签</label>
              <input id="fTags" type="text" maxlength="120" placeholder="用逗号分隔，如：方法论, PRD" />
            </div>
            <div class="field">
              <label for="fSource">来源</label>
              <input id="fSource" type="text" maxlength="60" placeholder="例如：个人记录" />
              <div class="sub">留空时记为「个人记录」。</div>
            </div>
          </div>
          <div class="sheet-actions">
            <button class="btn" type="button" id="formCancel">取消</button>
            <button class="btn primary" type="submit" id="formSave">保存条目</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 删除确认 -->
    <div class="overlay" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="sheet confirm-box" style="max-width:440px;">
        <h2 id="confirmTitle">删除这条条目？</h2>
        <p id="confirmText"></p>
        <p style="color:var(--muted);font-size:12.5px;">删除只在当前设备生效。如需找回，可先导出 JSON 备份。</p>
        <div class="sheet-actions">
          <button class="btn" type="button" id="confirmCancel">取消</button>
          <button class="btn" type="button" id="confirmDelete" style="background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600;">确认删除</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script>
      (function () {
        'use strict';

        var STORAGE_KEY = 'tracy-kb-public-v1';

        var LIBS = [
          { id: 'work',     name: '工作库' },
          { id: 'job',      name: '求职库' },
          { id: 'industry', name: '行业库' },
          { id: 'content',  name: '内容与创业库' },
          { id: 'personal', name: '个人库' },
          { id: 'calib',    name: '口径库' }
        ];
        function libName(id) {
          for (var i = 0; i < LIBS.length; i++) if (LIBS[i].id === id) return LIBS[i].name;
          return '未分类';
        }

        /* ---------------- 种子内容（公开版内置条目） ---------------- */
        var SEED = [
          /* 工作库 */
          { id: 'w1', lib: 'work', title: '产品分析路径', content: '业务背景→目标→角色→流程→异常→对象字段→权限状态机→交互→指标→验收', tags: ['方法论', '产品分析'], source: '个人方法论', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'w2', lib: 'work', title: 'PRD 结构', content: '范围 / 优先级 / 字段 / 校验 / 状态 / 权限 / 异常 / 验收；文字精炼', tags: ['PRD'], source: '个人方法论', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'w3', lib: 'work', title: '看板设计原则', content: '先有决策问题再有指标；口径（公式 / 数据源 / 粒度 / 去重）必须明确', tags: ['看板', '口径'], source: '个人方法论', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'w4', lib: 'work', title: '流程图规范', content: '区分串行并行，箭头符合真实依赖', tags: ['流程图'], source: '个人方法论', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'w5', lib: 'work', title: '闭环设计四原则', content: '目标倒排；设计做实（用户 / 岗位 / 权限 / 数据源 / 入口出口 / 回写机制）；先评再开发（Demo 对齐再立项）；兼顾当前与未来', tags: ['系统设计', '闭环'], source: '个人方法论', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'w6', lib: 'work', title: '目标倒排方法', content: '以规模目标定优先级，再反推能力缺口与实施顺序', tags: ['方法论', '规划'], source: '个人方法论', date: '2026-11-21', status: '已确认', origin: 'public' },

          /* 求职库 */
          { id: 'j1', lib: 'job', title: '面试故事：Robotaxi 平台规模化', content: '背景：Robotaxi 运营平台，乘客端 + 车辆运营系统。行动：工单分流自动化、调度与运力对接。结果：10 万 DAU、工单自动化 80%、乘客等待缩短 90 秒。', tags: ['面试故事', 'STAR'], source: '简历口径', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'j2', lib: 'job', title: '面试故事：从 0 到 1 搭建运营平台', content: 'B 端运营系统重构与商业化；路权管理全流程线上化是核心子模块之一。', tags: ['面试故事', 'STAR'], source: '简历口径', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'j3', lib: 'job', title: '面试故事：“一脸通”', content: '人脸识别产品，累计销售 2 亿+。', tags: ['面试故事', 'STAR'], source: '简历口径', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'j4', lib: 'job', title: '自我介绍结构', content: '30 秒 / 2 分钟 / 英文 50 秒三版本。英文版全文：“My name is Tracy Cui. I have eight years of experience in AI products. At Pony.ai, I worked on the Robotaxi platform — both the passenger app and the fleet operations system. We supported over 100,000 daily users, automated 80 percent of service tickets, and cut average passenger waiting time by 90 seconds. Now at JD Logistics, I lead the operations platform for driverless delivery vehicles, including right-of-way management, after-sales service, and the open platform. My strength is building operations platforms that can scale across cities, with clear workflows, exception handling, and metrics.”', tags: ['自我介绍', '英文'], source: '简历口径', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'j5', lib: 'job', title: '面试准备清单', content: '7 天练习计划；每个故事按 STAR 展开，数字必须准确。', tags: ['面试准备'], source: '个人记录', date: '2026-11-21', status: '已确认', origin: 'public' },

          /* 行业库 */
          { id: 'i1', lib: 'industry', title: 'WeRide 2026 Q3 财报', content: '营收 3.215 亿、+88%；Robotaxi 单季首破 1 亿、+204%，主要来自海外。', tags: ['财报', 'Robotaxi'], source: '公开财报', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'i2', lib: 'industry', title: 'Pony.ai 2026 Q3 财报', content: 'Robotaxi 收入 +165% 至 1780 万美元、车队 2768 辆。', tags: ['财报', 'Robotaxi'], source: '公开财报', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'i3', lib: 'industry', title: 'Waymo 高速禁令', content: '加州 DMV 禁令，暂停全美高速运营。', tags: ['政策', '安全'], source: '公开新闻', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'i4', lib: 'industry', title: 'Robotaxi 商业化判断', content: '海外先赚钱，关键在路权审批 + 本地运营 + 计费模型；安全事件会改写运营规则。', tags: ['商业化', '判断'], source: '个人判断', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'i5', lib: 'industry', title: '香港自动驾驶', content: '萝卜快跑获香港首张先导牌照，在北大屿山测试；文远与吉利远程、冠忠巴士合作右舵 Robotaxi，香港为首批试点。', tags: ['香港', '牌照'], source: '公开新闻', date: '2026-11-21', status: '已确认', origin: 'public' },

          /* 内容与创业库 */
          { id: 'c1', lib: 'content', title: '自媒体定位', content: '“前 Robotaxi 产品经理，讲 AI 怎么真正落到线下场景里”；备选“做了 8 年 AI 产品，我只讲能落地的那部分”。', tags: ['自媒体', '定位'], source: '个人记录', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'c2', lib: 'content', title: '内容三线', content: 'AI 工具实测 / 产品方法论 / 职场与搞钱；Robotaxi 作差异化背书而非全部内容。', tags: ['自媒体', '选题方向'], source: '个人记录', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'c3', lib: 'content', title: '发布节奏', content: '每周 2 篇，1 深 1 浅；深篇约 2 小时周末，浅篇约 1 小时工作日晚。', tags: ['自媒体', '节奏'], source: '个人记录', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'c4', lib: 'content', title: '选题清单', content: '#1 WeRide Q3 Robotaxi 收入首次破亿，钱到底从哪来？\n#2 我是做 Robotaxi 运营的产品经理，这号只讲 AI 落地\n#3 一个运营看板到底该长什么样？\n#4 我用 Claude/Cursor 写 PRD 的真实一天\n#5 路权管理：无人车上路最难的一关不是技术，是流程\n#6 8 年 AI 产品，从人脸识别到无人车，我换赛道的 3 个判断\n#7 Waymo 被禁上高速，Pony.ai 收入 +165%：安全事件怎么改写运营规则\n#8 用 AI 做一次竞品分析，省了我半天\n#9 副业第一年目标 3–5 万，我为什么先做内容、不接项目\n#10 工单自动化 80% 是怎么做到的？先讲分流逻辑，再讲人。', tags: ['自媒体', '选题'], source: '个人记录', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'c5', lib: 'content', title: '脱敏红线', content: '不出现公司内部数字；成就只用简历口径且不挂公司名；不出现内部系统名；不点名合作方及资源；不承诺收入、不讲个股。', tags: ['自媒体', '规范'], source: '个人记录', date: '2026-11-21', status: '已确认', origin: 'public' },

          /* 个人库 */
          { id: 'p1', lib: 'personal', title: '英语 5 条纠正规则', content: '一句话一个意思；work on a system vs work for a company；efficiency of managing；keep them running smoothly；create more value；句子 ≤15 词、数字必须准确。', tags: ['英语', '口语'], source: '学习记录', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'p2', lib: 'personal', title: '英语词汇种子', content: 'commercial launch、fully driverless、revenue up …% year on year、fleet、geofence、letter of intent (LOI)、rollout、conditional on、autonomy subscription、regulatory restriction / ban', tags: ['英语', '词汇'], source: '学习记录', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'p3', lib: 'personal', title: '健身框架', content: '每周 4 次力量（上下肢分化）+ 有氧；周一上肢 A / 周二下肢 A / 周三休息或有氧 / 周四上肢 B / 周五下肢 B / 周六有氧 / 周日休息。', tags: ['健身', '计划'], source: '个人记录', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'p4', lib: 'personal', title: '决策记录：收入加时间自由', content: '评估机会时薪酬与工时一起权衡，不为高薪接受长期高强度工时。', tags: ['决策记录'], source: '个人记录', date: '2026-11-15', status: '已确认', origin: 'public' },
          { id: 'p5', lib: 'personal', title: '决策记录：三件事聚焦', content: '平台规划做好、简历待补补上、英语和健身维持节奏不加量；其余先放下。', tags: ['决策记录'], source: '个人记录', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'p6', lib: 'personal', title: '决策记录：准备比预测重要', content: '不为宏观预测做激进操作，准备（应急现金、分散、可迁移能力）比预测可靠。', tags: ['决策记录'], source: '个人记录', date: '2026-11-21', status: '已确认', origin: 'public' },

          /* 口径库 */
          { id: 'k1', lib: 'calib', title: '10 万 DAU', content: 'Robotaxi 平台日活跃用户口径：10 万 DAU。', tags: ['口径', '简历'], source: '简历口径', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'k2', lib: 'calib', title: '工单自动化 80%', content: '工单自动化比例口径：80%。', tags: ['口径', '简历'], source: '简历口径', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'k3', lib: 'calib', title: '乘客等待缩短 90 秒', content: '乘客平均等待时间缩短口径：90 秒。', tags: ['口径', '简历'], source: '简历口径', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'k4', lib: 'calib', title: '“一脸通”累计销售 2 亿+', content: '“一脸通”产品累计销售口径：2 亿+。', tags: ['口径', '简历'], source: '简历口径', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'k5', lib: 'calib', title: 'WeRide Q3 营收 3.215 亿 +88%', content: 'WeRide 2026 Q3 营收 3.215 亿，同比 +88%。', tags: ['口径', '财报'], source: '公开财报', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'k6', lib: 'calib', title: 'WeRide Robotaxi 单季首破 1 亿 +204%', content: 'WeRide Robotaxi 单季收入首破 1 亿，同比 +204%。', tags: ['口径', '财报'], source: '公开财报', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'k7', lib: 'calib', title: 'Pony.ai Q3 Robotaxi 收入 1780 万美元 +165%', content: 'Pony.ai 2026 Q3 Robotaxi 收入 1780 万美元，同比 +165%。', tags: ['口径', '财报'], source: '公开财报', date: '2026-11-21', status: '已确认', origin: 'public' },
          { id: 'k8', lib: 'calib', title: 'Pony.ai 车队 2768 辆', content: 'Pony.ai 车队规模口径：2768 辆。', tags: ['口径', '财报'], source: '公开财报', date: '2026-11-21', status: '已确认', origin: 'public' }
        ];

        /* ---------------- 状态 ---------------- */
        var entries = load();
        var currentLib = 'all';
        var query = '';
        var editingId = null;
        var deletingId = null;

        function load() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && Object.prototype.toString.call(parsed.entries) === '[object Array]') {
                return parsed.entries.map(normalize).filter(Boolean);
              }
            }
          } catch (e) { /* 存储不可用时退回种子数据 */ }
          return SEED.slice();
        }
        function normalize(e) {
          if (!e || typeof e !== 'object' || !e.title) return null;
          return {
            id: String(e.id || uid()),
            lib: libName(e.lib) === '未分类' && e.lib !== 'work' && e.lib !== 'job' && e.lib !== 'industry' && e.lib !== 'content' && e.lib !== 'personal' && e.lib !== 'calib' ? 'work' : e.lib,
            title: String(e.title),
            content: String(e.content || ''),
            tags: Object.prototype.toString.call(e.tags) === '[object Array]' ? e.tags.map(String) : splitTags(e.tags || ''),
            source: String(e.source || '个人记录'),
            date: String(e.date || todayStr()),
            status: e.status === '待确认' ? '待确认' : '已确认',
            origin: e.origin === 'mine' ? 'mine' : 'public'
          };
        }
        function save() {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, entries: entries })); }
          catch (e) { showToast('浏览器存储不可用，本次修改可能无法保留'); }
        }
        function uid() { return 'm' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }
        function todayStr() {
          var d = new Date();
          function p(n) { return (n < 10 ? '0' : '') + n; }
          return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
        }
        function splitTags(s) {
          return String(s).split(/[,，、]/).map(function (t) { return t.trim(); }).filter(Boolean);
        }

        /* ---------------- 渲染 ---------------- */
        var libListEl = document.getElementById('libList');
        var mainEl = document.getElementById('listMain');
        var noteEl = document.getElementById('resultNote');
        var searchEl = document.getElementById('searchInput');
        var clearEl = document.getElementById('clearSearch');

        function esc(s) {
          return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }
        function highlight(text) {
          var t = esc(text);
          if (!query) return t;
          var q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          try { return t.replace(new RegExp('(' + q + ')', 'gi'), '<mark>$1</mark>'); }
          catch (e) { return t; }
        }
        function matches(e) {
          if (currentLib !== 'all' && e.lib !== currentLib) return false;
          if (!query) return true;
          var hay = (e.title + '\n' + e.content + '\n' + e.tags.join(' ') + '\n' + e.source).toLowerCase();
          return hay.indexOf(query.toLowerCase()) !== -1;
        }
        function countByLib(id) {
          return entries.filter(function (e) { return id === 'all' || e.lib === id; }).length;
        }

        function renderNav() {
          var html = '';
          var tabs = [{ id: 'all', name: '索引' }].concat(LIBS);
          tabs.forEach(function (t) {
            html += '<li><button type="button" class="lib-btn' + (currentLib === t.id ? ' active' : '') +
              '" data-lib="' + t.id + '">' + esc(t.name) +
              '<span class="count">' + countByLib(t.id) + '</span></button></li>';
          });
          libListEl.innerHTML = html;
          var btns = libListEl.querySelectorAll('.lib-btn');
          for (var i = 0; i < btns.length; i++) {
            btns[i].addEventListener('click', function () {
              currentLib = this.getAttribute('data-lib');
              render();
            });
          }
        }

        function cardHtml(e) {
          var tagsHtml = e.tags.length
            ? '<span>标签：' + e.tags.map(function (t) { return '<span class="tag-chip">#' + highlight(t) + '</span>'; }).join(' ') + '</span>'
            : '';
          return '<article class="card" data-id="' + esc(e.id) + '">' +
            '<div class="card-head"><h3 class="card-title">' + highlight(e.title) + '</h3>' +
            '<div class="badges">' +
              '<span class="badge lib">' + esc(libName(e.lib)) + '</span>' +
              (e.origin === 'mine' ? '<span class="badge mine">我的</span>' : '<span class="badge pub">公开</span>') +
              '<span class="badge ' + (e.status === '待确认' ? 'pending' : 'ok') + '">' + esc(e.status) + '</span>' +
            '</div></div>' +
            '<div class="card-content' + (e.content.length > 220 ? ' long' : '') + '">' + highlight(e.content) + '</div>' +
            '<div class="card-meta">' + tagsHtml +
              '<span>来源：' + esc(e.source) + '</span>' +
              '<span>日期：' + esc(e.date) + '</span>' +
            '</div>' +
            '<div class="card-actions">' +
              '<button type="button" class="btn small" data-act="edit">编辑</button>' +
              '<button type="button" class="btn small danger" data-act="del">删除</button>' +
            '</div>' +
          '</article>';
        }

        function render() {
          renderNav();
          var visible = entries.filter(matches);
          if (currentLib === 'all' && !query) {
            noteEl.textContent = '共 ' + entries.length + ' 条 · 按库分组展示';
          } else {
            noteEl.textContent = '找到 ' + visible.length + ' 条' + (query ? ' · 关键词「' + query + '」' : '') + (currentLib !== 'all' ? ' · ' + libName(currentLib) : '');
          }
          if (!visible.length) {
            mainEl.innerHTML = '<div class="empty">' +
              (entries.length === 0
                ? '知识库是空的。点右上角「新增条目」添加第一条，或用「导入 JSON」恢复备份。'
                : '没有匹配的条目。换个关键词，或切回「索引」看全部。') +
              '</div>';
            return;
          }
          var html = '';
          if (currentLib === 'all') {
            LIBS.forEach(function (l) {
              var group = visible.filter(function (e) { return e.lib === l.id; });
              if (!group.length) return;
              html += '<h2 class="group-title">' + esc(l.name) + '<span class="g-count">' + group.length + ' 条</span></h2>';
              html += '<div class="cards">' + group.map(cardHtml).join('') + '</div>';
            });
          } else {
            html += '<div class="cards" style="margin-top:14px;">' + visible.map(cardHtml).join('') + '</div>';
          }
          mainEl.innerHTML = html;
          var cards = mainEl.querySelectorAll('.card');
          for (var i = 0; i < cards.length; i++) {
            (function (card) {
              var id = card.getAttribute('data-id');
              card.querySelector('[data-act="edit"]').addEventListener('click', function () { openForm(id); });
              card.querySelector('[data-act="del"]').addEventListener('click', function () { openConfirm(id); });
            })(cards[i]);
          }
        }

        /* ---------------- 搜索 ---------------- */
        searchEl.addEventListener('input', function () {
          query = this.value.trim();
          clearEl.style.display = query ? 'inline-flex' : 'none';
          render();
        });
        clearEl.addEventListener('click', function () {
          searchEl.value = ''; query = '';
          clearEl.style.display = 'none';
          render(); searchEl.focus();
        });

        /* ---------------- 表单 ---------------- */
        var overlay = document.getElementById('formOverlay');
        var form = document.getElementById('entryForm');
        var fLib = document.getElementById('fLib');
        var fStatus = document.getElementById('fStatus');
        var fTitle = document.getElementById('fTitle');
        var fContent = document.getElementById('fContent');
        var fTags = document.getElementById('fTags');
        var fSource = document.getElementById('fSource');
        var formTitle = document.getElementById('formTitle');

        fLib.innerHTML = LIBS.map(function (l) { return '<option value="' + l.id + '">' + esc(l.name) + '</option>'; }).join('');

        function openForm(id) {
          editingId = id || null;
          if (id) {
            var e = entries.filter(function (x) { return x.id === id; })[0];
            if (!e) return;
            formTitle.textContent = '编辑条目';
            fLib.value = e.lib; fStatus.value = e.status;
            fTitle.value = e.title; fContent.value = e.content;
            fTags.value = e.tags.join(', ');
            fSource.value = e.source;
          } else {
            formTitle.textContent = '新增条目';
            form.reset();
            fLib.value = currentLib !== 'all' ? currentLib : 'work';
            fStatus.value = '已确认';
          }
          overlay.classList.add('open');
          setTimeout(function () { fTitle.focus(); }, 30);
        }
        function closeForm() { overlay.classList.remove('open'); editingId = null; }

        document.getElementById('addBtn').addEventListener('click', function () { openForm(null); });
        document.getElementById('formCancel').addEventListener('click', closeForm);
        overlay.addEventListener('click', function (ev) { if (ev.target === overlay) closeForm(); });

        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          var title = fTitle.value.trim();
          var content = fContent.value.trim();
          if (!title || !content) { showToast('标题和内容不能为空'); return; }
          if (editingId) {
            for (var i = 0; i < entries.length; i++) {
              if (entries[i].id === editingId) {
                entries[i].lib = fLib.value;
                entries[i].status = fStatus.value;
                entries[i].title = title;
                entries[i].content = content;
                entries[i].tags = splitTags(fTags.value);
                entries[i].source = fSource.value.trim() || '个人记录';
                break;
              }
            }
            showToast('已保存修改（仅本设备）');
          } else {
            entries.push({
              id: uid(), lib: fLib.value, title: title, content: content,
              tags: splitTags(fTags.value),
              source: fSource.value.trim() || '个人记录',
              date: todayStr(), status: fStatus.value, origin: 'mine'
            });
            showToast('已新增条目（仅本设备）');
          }
          save(); closeForm(); render();
        });

        /* ---------------- 删除 ---------------- */
        var confirmOverlay = document.getElementById('confirmOverlay');
        var confirmText = document.getElementById('confirmText');
        function openConfirm(id) {
          var e = entries.filter(function (x) { return x.id === id; })[0];
          if (!e) return;
          deletingId = id;
          confirmText.textContent = '「' + e.title + '」（' + libName(e.lib) + '）';
          confirmOverlay.classList.add('open');
        }
        function closeConfirm() { confirmOverlay.classList.remove('open'); deletingId = null; }
        document.getElementById('confirmCancel').addEventListener('click', closeConfirm);
        confirmOverlay.addEventListener('click', function (ev) { if (ev.target === confirmOverlay) closeConfirm(); });
        document.getElementById('confirmDelete').addEventListener('click', function () {
          if (!deletingId) return;
          entries = entries.filter(function (x) { return x.id !== deletingId; });
          save(); closeConfirm(); render();
          showToast('已删除（仅本设备）');
        });

        /* ---------------- 导出 / 导入 ---------------- */
        document.getElementById('exportBtn').addEventListener('click', function () {
          var payload = JSON.stringify({ app: 'personal-kb', version: 1, exportedAt: todayStr(), entries: entries }, null, 2);
          var blob = new Blob([payload], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = '个人知识库备份-' + todayStr() + '.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 800);
          showToast('已导出 ' + entries.length + ' 条的备份 JSON');
        });

        var importFile = document.getElementById('importFile');
        document.getElementById('importBtn').addEventListener('click', function () { importFile.click(); });
        importFile.addEventListener('change', function () {
          var file = importFile.files && importFile.files[0];
          importFile.value = '';
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            try {
              var data = JSON.parse(String(reader.result));
              var list = Object.prototype.toString.call(data) === '[object Array]' ? data : data.entries;
              if (!list || Object.prototype.toString.call(list) !== '[object Array]') throw new Error('bad format');
              var added = 0, updated = 0;
              list.map(normalize).filter(Boolean).forEach(function (imp) {
                var idx = -1;
                for (var i = 0; i < entries.length; i++) if (entries[i].id === imp.id) { idx = i; break; }
                if (idx >= 0) { entries[idx] = imp; updated++; }
                else { entries.push(imp); added++; }
              });
              save(); render();
              showToast('导入完成：新增 ' + added + ' 条，更新 ' + updated + ' 条');
            } catch (e) {
              showToast('导入失败：文件不是有效的知识库 JSON 备份');
            }
          };
          reader.onerror = function () { showToast('导入失败：无法读取该文件'); };
          reader.readAsText(file);
        });

        /* ---------------- Toast ---------------- */
        var toastEl = document.getElementById('toast');
        var toastTimer = null;
        function showToast(msg) {
          toastEl.textContent = msg;
          toastEl.classList.add('show');
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
        }

        document.addEventListener('keydown', function (ev) {
          if (ev.key === 'Escape') { closeForm(); closeConfirm(); }
        });

        render();
      })();
    </script>
  </body>
</html>
